name: pc-in-browser

# Запускается в GitHub Codespaces (или на любом сервере с Docker).
# Linux:    docker compose up -d                       -> порт 3000
# Windows:  docker compose --profile windows up -d     -> порт 8006

services:
  linux:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: linux-desktop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Yekaterinburg
      - CUSTOM_USER=user
      - PASSWORD=ChangeMe123
    ports:
      - "3000:3000"
    shm_size: "1gb"
    volumes:
      - ./data/linux:/config
    restart: unless-stopped

  windows:
    image: dockurr/windows
    container_name: windows-desktop
    profiles: ["windows"]
    environment:
      VERSION: "10l"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "32G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
    volumes:
      - ./data/windows:/storage
    stop_grace_period: 2m
    restart: unless-stopped
